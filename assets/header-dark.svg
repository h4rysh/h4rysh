<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Subtle Accent Glow -->
    <radialGradient id="glowDark" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridDark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <!-- Linear Gradient for Text Highlight -->
    <linearGradient id="textGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="998" height="318" rx="16" fill="url(#bgDark)" stroke="#30363d" stroke-width="1.5" />
  <rect x="1" y="1" width="998" height="318" rx="16" fill="url(#gridDark)" />
  <rect x="1" y="1" width="998" height="318" rx="16" fill="url(#glowDark)" />

  <!-- Top Pill / Status Indicator -->
  <g transform="translate(48, 42)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <circle cx="16" cy="14" r="8" fill="#10b981" fill-opacity="0.25">
      <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.4;0.05;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="18" fill="#94a3b8" font-size="11" font-weight="600" class="mono" letter-spacing="0.5">OPEN TO OPPORTUNITIES · 2026</text>
  </g>

  <!-- Main Headline -->
  <text x="48" y="126" fill="url(#textGradDark)" font-size="44" font-weight="700" letter-spacing="-1" class="font-base">
    Harrish Gayathri
  </text>

  <!-- Subtitle / Tagline -->
  <text x="48" y="162" fill="#38bdf8" font-size="17" font-weight="600" letter-spacing="0.2" class="font-base">
    Software Engineer · AI Systems &amp; Safe Product Engineering
  </text>
  <text x="48" y="190" fill="#94a3b8" font-size="14.5" font-weight="400" class="font-base">
    Systems that think. Products that ship. Building financial safety, AI reconciliation, and assistive tech.
  </text>

  <!-- Tech Badges / Stack Pills -->
  <g transform="translate(48, 236)">
    <!-- Pill 1: Node.js / AI -->
    <rect x="0" y="0" width="130" height="32" rx="8" fill="#161e2e" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="20" fill="#e2e8f0" font-size="12" font-weight="500" class="font-base">⚡ Gemini &amp; AI</text>

    <!-- Pill 2: Kotlin -->
    <rect x="142" y="0" width="168" height="32" rx="8" fill="#161e2e" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="156" y="20" fill="#e2e8f0" font-size="12" font-weight="500" class="font-base">📱 Kotlin · Compose</text>

    <!-- Pill 3: Flutter -->
    <rect x="322" y="0" width="144" height="32" rx="8" fill="#161e2e" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="336" y="20" fill="#e2e8f0" font-size="12" font-weight="500" class="font-base">🛡️ Flutter · Dart</text>

    <!-- Pill 4: Node/Firebase -->
    <rect x="478" y="0" width="158" height="32" rx="8" fill="#161e2e" stroke="#64748b" stroke-opacity="0.4" stroke-width="1" />
    <text x="492" y="20" fill="#e2e8f0" font-size="12" font-weight="500" class="font-base">🌐 Node.js · Firebase</text>
  </g>

  <!-- Right Side Architectural Flow Graphic -->
  <g transform="translate(710, 48)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="242" height="224" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    
    <!-- Header of Node Box -->
    <path d="M 0 12 Q 0 0 12 0 L 230 0 Q 242 0 242 12 L 242 32 L 0 32 Z" fill="#1e293b" />
    <circle cx="16" cy="16" r="3.5" fill="#ef4444" />
    <circle cx="28" cy="16" r="3.5" fill="#f59e0b" />
    <circle cx="40" cy="16" r="3.5" fill="#10b981" />
    <text x="56" y="20" fill="#94a3b8" font-size="10.5" font-weight="600" class="mono">SYSTEM_VERIFICATION</text>

    <!-- Step 1: Input -->
    <rect x="18" y="46" width="206" height="34" rx="6" fill="#161f30" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="28" y="67" fill="#38bdf8" font-size="11" font-weight="600" class="mono">01. INGEST &amp; PARSE</text>
    <text x="160" y="67" fill="#64748b" font-size="10" class="mono">raw</text>

    <!-- Connecting line 1 -->
    <line x1="121" y1="80" x2="121" y2="94" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Step 2: Verification Rule Engine -->
    <rect x="18" y="94" width="206" height="34" rx="6" fill="#161f30" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="28" y="115" fill="#a5b4fc" font-size="11" font-weight="600" class="mono">02. RULE VERIFY</text>
    <text x="150" y="115" fill="#10b981" font-size="10" font-weight="600" class="mono">STRICT</text>

    <!-- Connecting line 2 -->
    <line x1="121" y1="128" x2="121" y2="142" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Step 3: Verified Execution -->
    <rect x="18" y="142" width="206" height="34" rx="6" fill="#161f30" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="28" y="163" fill="#6ee7b7" font-size="11" font-weight="600" class="mono">03. COMMITTED TX</text>
    <text x="162" y="163" fill="#10b981" font-size="10" class="mono">100%</text>

    <!-- Footer of Node Box -->
    <line x1="18" y1="190" x2="224" y2="190" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="208" fill="#64748b" font-size="10" class="mono">PIPELINE: GHOST-TX / IMAI</text>
  </g>
</svg>